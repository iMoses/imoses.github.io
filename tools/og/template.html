<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Mono; font-weight: 600; src: url(../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2); }
  @font-face { font-family: Mono; font-weight: 500; src: url(../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2); }
  html, body { margin: 0; }
  body {
    position: relative; overflow: hidden; width: 1200px; height: 630px;

    background-image:

  .logo { display: block; height: 144px; width: auto; }

  p { margin: 24px 0 0; font: 500 34px/48px Mono; color: #46546e; }

  .fig { left: 96px; letter-spacing: .16em; }
  .url { right: 96px; }
  .ticks span { position: absolute; top: 6px; font: 500 14px/1 Mono; color: #6b778c; }
