---
layout: root
---
<article class="entry snap">
  <header class="entry-header snap">
    <p class="fig-label">Fig. {{ page.fig }}</p>
    <h1>{{ page.title }}</h1>
    {%- if page.subtitle %}<p class="entry-subtitle">{{ page.subtitle }}</p>{% endif %}
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>
  </header>
  {{ content }}
  <p class="back"><a href="/">← Back to the lab</a></p>
</article>
