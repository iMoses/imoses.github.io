title: Ido Moshe
tagline: Full-stack engineer, from pixels to pipelines
description: >-
  Ido Moshe (iMoses) — full-stack engineer. A lab of small, interactive experiments.
author: Ido Moshe
url: https://imoses.me
lang: en

permalink: /lab/:slug/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: entry

plugins:
  - jekyll-seo-tag

sass:
  style: compressed
  sourcemap: never

exclude:
  - .idea
  - README.md
  - LICENSE
  - AGENTS.md
  - CLAUDE.md
  - docs
  - demos
  - node_modules
  - package.json
  - package-lock.json
